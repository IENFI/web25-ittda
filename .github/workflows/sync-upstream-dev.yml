# .github/workflows/sync-upstream-dev.yml
name: Sync Fork Dev

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-fork-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Sync upstream dev while keeping fork workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream \
            https://github.com/boostcampwm2025/web25-ittda.git

          git fetch upstream dev

          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "Already up to date"
            exit 0
          fi

          git config merge.ours.driver true
          echo '.github/workflows/** merge=ours' >> .git/info/attributes

          git merge --no-commit --no-ff upstream/dev

          # 원본의 workflow는 가져오지 않고 개인 fork의 workflow만 유지
          git restore \
            --source=HEAD \
            --staged \
            --worktree \
            .github/workflows

          git commit -m "chore: sync upstream dev"
          git push origin dev
